# Builds one of this repo's two packages and, when asked, releases it. The same workflow as REDnode's
# and REDcode's release.yml, so every Edgemodders tool releases the same way.
#
#   What            Folder                   Built                               Tag
#   EDGEquest       extensions/edgequest     .vsix and the Nexus zip             v<version>
#   edgequest-mcp   packages/edgequest-mcp   the npm package (.tgz)              mcp-v<version>
#
#   Run workflow (Actions tab)                  builds it and keeps the files as the run's artifact, to
#                                               install and test before a release; publishes nothing
#   Run workflow, "Make a release" ticked       also publishes it (the extension to the VS Code
#                                               Marketplace, VSCE_PAT, and Open VSX, OVSX_PAT;
#                                               edgequest-mcp to npm with provenance, NPM_TOKEN) and makes
#                                               the GitHub release, which tags the commit. Stops first if
#                                               that tag exists (raise the version), if it is not run on
#                                               main, or if CHANGELOG.md has no section for the version
#                                               (tools/release-notes.mjs), or, for EDGEquest, if
#                                               README.md's status line and badge do not say the version
#                                               (tools/release/readme-check.mjs, REDnode's file)
#   npm run release / release:mcp               the same as ticking the box, from a terminal
#   ... and "Update Nexus Mods" ticked          EDGEquest only (npm run release:nexus): also, after the
#   (EDGEquest only)                            GitHub release, uploads the Nexus zip to the page
#                                               (nexus/nexus.json, 35750) as the main file's new
#                                               version (the old one archived, Mod Manager Download
#                                               off: an extension, not a game mod), adds its changelog
#                                               and pushes nexus/description.bbcode
#                                               (the Nexus tool, from EDGErepo at the tag v1; NEXUS_KEY).
#                                               It checks the page first and stops before building if
#                                               the description changed on Nexus since the last pull
#                                               (npm run nexus:pull, merge, commit, run again). If the
#                                               upload fails after the GitHub release, run
#                                               node ../EDGErepo/tools/nexus/nexus.mjs release on the
#                                               dev PC with the release's zip: it skips what is
#                                               already done.
#
# The Nexus zip is tools/nexus-zip.mjs. Only EDGEquest's releases become the repository's Latest
# release. The tokens are Edgemodders organisation secrets, shared with the other tools' workflows.
# Release gate: make a release only after every test of the changes since the last release has passed.
name: Release

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to build
        type: choice
        options: [EDGEquest, edgequest-mcp]
        default: EDGEquest
      release:
        description: Make a release (publishes it and tags this commit). Only after every test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (EDGEquest, with Make a release) - upload the Nexus zip, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

# One run at a time per package; GitHub keeps one waiting run per group.
concurrency:
  group: release-${{ inputs.what }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: What, and its version
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          case "${WHAT}" in
            EDGEquest)     dir=extensions/edgequest;   prefix=v;     kind=extension ;;
            edgequest-mcp) dir=packages/edgequest-mcp; prefix=mcp-v; kind=npm ;;
            *) echo "::error::Unknown package ${WHAT}"; exit 1 ;;
          esac
          name=$(node -p "require('./${dir}/package.json').name")
          version=$(node -p "require('./${dir}/package.json').version")
          {
            echo "DIR=${dir}"; echo "KIND=${kind}"
            echo "NAME=${name}"; echo "VERSION=${version}"; echo "TAG=${prefix}${version}"
            echo "VSIX=${GITHUB_WORKSPACE}/dist/${name}-${version}.vsix"
          } >> "$GITHUB_ENV"
          if [ "${{ inputs.nexus }}" = "true" ] && [ "${WHAT}" != "EDGEquest" ]; then
            echo "::error::Only EDGEquest has a Nexus page; untick Update Nexus Mods for ${WHAT}"
            exit 1
          fi
          if [ "${{ inputs.release }}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${prefix}${version}" --silent >/dev/null 2>&1; then
              echo "::error::${prefix}${version} is already released. Raise the version in ${dir}/package.json."
              exit 1
            fi
          fi

      # Before anything is built: a README that does not say EDGEquest's version stops its release here.
      - name: The README says this release
        if: inputs.release && inputs.what == 'EDGEquest'
        run: node tools/release/readme-check.mjs --version "${VERSION}"

      # Before anything is built: no CHANGELOG.md section for the version stops a release here.
      - name: Release notes from the CHANGELOG
        if: inputs.release
        run: |
          node tools/release-notes.mjs "${DIR}" "${VERSION}" --out "${RUNNER_TEMP}/notes.md"
          node tools/release-notes.mjs "${DIR}" "${VERSION}" --nexus --out "${RUNNER_TEMP}/nexus-notes.txt"

      # The Nexus tool, shared by the Edgemodders repos at this tag (REDnode's docs/edgerepo.md). Outside
      # the workspace, so nothing packs it.
      - name: The Nexus tool
        if: inputs.release && inputs.nexus
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch v1 https://github.com/Edgemodders/EDGErepo "$RUNNER_TEMP/EDGErepo"

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: node "$RUNNER_TEMP/EDGErepo/tools/nexus/nexus.mjs" check --version "${VERSION}"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace "${DIR}"

      - name: Package the extension
        id: package
        if: env.KIND == 'extension'
        run: |
          mkdir -p dist
          cd "${DIR}"
          "${GITHUB_WORKSPACE}/node_modules/.bin/vsce" package --no-dependencies --out "${VSIX}"

      - name: Nexus zip
        if: env.KIND == 'extension'
        run: node tools/nexus-zip.mjs

      - name: Build the npm package
        if: env.KIND == 'npm'
        run: |
          npm run mcp:build
          mkdir -p dist
          npm pack --workspace "${DIR}" --pack-destination dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.what }}
          path: |
            dist/*.vsix
            dist/*-nexus.zip
            dist/*.tgz
          if-no-files-found: error

      - name: VS Code Marketplace
        if: inputs.release && env.KIND == 'extension'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # --skip-duplicate: a re-run of a release that got partway does not fail on what is already out.
        run: node_modules/.bin/vsce publish --packagePath "${VSIX}" --skip-duplicate

      # Each registry is tried even when another one failed; the run still fails if any of them did.
      - name: Open VSX
        if: ${{ inputs.release && env.KIND == 'extension' && !cancelled() && steps.package.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT is not set; not published to Open VSX"
            exit 0
          fi
          node_modules/.bin/ovsx publish "${VSIX}" --pat "${OVSX_PAT}" --skip-duplicate

      # npm stages a new publish: a 0.0.0-stage placeholder shows for about six minutes before the version.
      - name: npm
        if: inputs.release && env.KIND == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME} ${VERSION} is already on npm"
            exit 0
          fi
          npm publish --workspace "${DIR}" --provenance --access public

      # Makes the tag too (--target: this commit). Only EDGEquest becomes the repository's Latest release.
      - name: GitHub release
        if: ${{ inputs.release && !cancelled() && (env.KIND == 'npm' || steps.package.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
        run: |
          files=()
          latest="--latest=false"
          case "${WHAT}" in
            EDGEquest) files=("${VSIX}" "dist/EDGEquest-${VERSION}-nexus.zip"); latest="" ;;
          esac
          gh release create "${TAG}" "${files[@]}" --target "${GITHUB_SHA}" --title "${WHAT} ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" ${latest}

      # After the GitHub release a re-run stops at the tag check: if this step fails, run the same command
      # on the dev PC with the release's zip; it skips what is already on Nexus.
      - name: Nexus Mods
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: node "$RUNNER_TEMP/EDGErepo/tools/nexus/nexus.mjs" release --version "${VERSION}" --zip "dist/EDGEquest-${VERSION}-nexus.zip" --notes "${RUNNER_TEMP}/nexus-notes.txt"
